[project]
name = "openmind-berkeley"
version = "2.0.0"
description = "A local, read-only bCourses (Canvas) MCP server for UC Berkeley students"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Qazybek Beken" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["berkeley", "bcourses", "canvas", "mcp", "model-context-protocol", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "pypdf>=5",
    "keyring>=25",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-anyio",
    "hypothesis",
    "ruff",
    "mcp[cli]>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/qazybekb/openmind"
Repository = "https://github.com/qazybekb/openmind"
Documentation = "https://github.com/qazybekb/openmind/blob/main/docs/SETUP.md"
Changelog = "https://github.com/qazybekb/openmind/blob/main/CHANGELOG.md"
Issues = "https://github.com/qazybekb/openmind/issues"

[project.scripts]
openmind = "openmind.cli:main"
openmind-mcp = "openmind.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmind"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/openmind",
    "/scripts",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
