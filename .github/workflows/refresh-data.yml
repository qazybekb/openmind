name: Refresh Berkeley course data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      skip_offerings:
        description: "Refresh catalogs only, keeping previous offerings"
        type: boolean
        default: false
      publish_only:
        description: "Publish the committed snapshot without crawling"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'qazybekb/openmind'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Verify the parser and publication contract
        run: python -m pytest tests/test_schedule.py tests/test_catalog.py tests/test_refresh_script.py tests/test_refresh_coverage.py tests/test_data_release.py -q

      # GitHub runners may get HTTP 403 from classes.berkeley.edu. The script keeps
      # previous offerings in that case; coverage failures still stop publication.
      - name: Refresh the data
        if: ${{ !inputs.publish_only }}
        env:
          SKIP_OFFERINGS: ${{ inputs.skip_offerings }}
        run: |
          ARGS=()
          if [ "$SKIP_OFFERINGS" = "true" ]; then ARGS+=(--skip-offerings); fi
          python scripts/refresh_catalog.py --out src/openmind/data "${ARGS[@]}"

      - name: Validate the snapshot
        run: python -m pytest tests/test_catalog.py -q

      # Always prepare: unchanged CSVs may still have no published asset. The
      # content-addressed tag and deterministic archive make retries idempotent.
      - name: Prepare the data asset and manifest
        id: asset
        run: python scripts/prepare_data_release.py --data src/openmind/data --out "$RUNNER_TEMP/openmind-data" --github-output "$GITHUB_OUTPUT"

      - name: Publish and verify the immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.asset.outputs.tag }}
          FILE: ${{ steps.asset.outputs.file }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          SHA: ${{ steps.asset.outputs.sha }}
        run: |
          if gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/data-release.json"; then
            EXISTING=$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest' "$RUNNER_TEMP/data-release.json")
            if [ -z "$EXISTING" ]; then
              gh release upload "$TAG" "$FILE" --repo "$REPO"
            elif [ "$EXISTING" != "sha256:$SHA" ]; then
              echo "Existing immutable asset has an unexpected digest; refusing to overwrite it." >&2
              exit 1
            fi
          else
            gh release create "$TAG" "$FILE" --repo "$REPO" --target "$(git rev-parse HEAD)" \
              --title "Berkeley course data $TAG" \
              --notes "Public catalog snapshot. SHA-256: $SHA" --latest=false
          fi
          VERIFIED=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest")
          test "$VERIFIED" = "sha256:$SHA"

      # Clients fetch src/openmind/data/catalog_meta.json from the default branch.
      # Publish its hash only after the matching asset exists and has been verified.
      - name: Commit the published manifest and refreshed data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DATA_DATE: ${{ steps.asset.outputs.date }}
        run: |
          git add src/openmind/data
          if git diff --cached --quiet; then
            echo "Snapshot already published; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Berkeley course data ($DATA_DATE)"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
