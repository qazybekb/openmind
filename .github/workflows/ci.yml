name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: python -m pytest -q

      # A host spawns the server and waits for a protocol frame on stdout. Anything
      # else there — a banner, a warning, a stray print — breaks the handshake.
      - name: Verify the server starts silently and describes itself
        run: python -m pytest tests/test_release_contract.py -q

      - name: Verify the CLI
        run: |
          python -m openmind --help
          python -m openmind --version
          python -m openmind mcp

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify the catalog data ships in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q "openmind/data/undergraduate_courses.csv"
          python -m zipfile -l dist/*.whl | grep -q "openmind/data/graduate_courses.csv"

  website:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build
